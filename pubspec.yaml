name: scrup
description: "scrapper."
publish_to: 'none'
version: 1.0.0+9

environment:
  sdk: ^3.12.2

dependencies:
  audio_service: ^0.18.18
  audio_service_mpris: ^0.2.0
  audio_service_win: 0.0.3
  audio_session: ^0.1.25
  just_audio: ^0.9.43
  crypto: ^3.0.3
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  image: ^4.5.3
  intl: ^0.20.2
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  miniplayer: ^1.0.1
  palette_generator: ^0.3.3+7
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  window_manager: ^0.5.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4

# miniplayer vendoreado (third_party/miniplayer) con parches propios:
# - un toque sobre el player expandido NO lo cierra (solo expande desde la
#   barra compacta);
# - lockPanel: bloquea el tap/arrastre del panel expandido mientras el sheet
#   de letras está abierto (para no cerrar el player al cerrar las letras).
dependency_overrides:
  miniplayer:
    path: third_party/miniplayer

# Iconos de lanzador (Android): se generan desde assets/app-logo.png con
# "dart run flutter_launcher_icons". Mantiene el icono de la app en mobile.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app-logo.png"
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/app-logo.png"
  remove_alpha_ios: false

flutter:
  uses-material-design: true
  # Assets de la app (logo, imágenes empaquetadas): el usuario reemplaza
  # assets/app-logo.png por su logo real.
  assets:
    - assets/
  # Shaders de fragmento compilados con impellerc: el fondo líquido del
  # fullscreen va AQUÍ, no en assets/. La sección `shaders:` es lo que
  # dispara la compilación a IPLR/SPIR-V; en assets/ el tool solo copia
  # el fuente crudo y FragmentProgram.fromAsset falla en runtime.
  shaders:
    - shaders/liquid_bg.frag
  # Genera las localizaciones (AppLocalizations) automáticamente al compilar
  # desde lib/l10n/*.arb (ver l10n.yaml).
  generate: true
